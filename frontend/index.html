<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>TokZoo</title>
    <meta
      name="description"
      content="TokZoo - Shop, discover products, and connect with sellers."
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fe2c55" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TokZoo" />

    <meta name="application-name" content="TokZoo" />
    <meta name="msapplication-TileColor" content="#fe2c55" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/sw.js")
            .catch(function (error) {
              console.error("Service worker registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
